# Contest demo should use the local Windows launcher (一键启动.bat).
# Free-plan filesystems are ephemeral. The container SQLite at
# backend/data/projects.sqlite may be lost after sleep, wake (a new
# container may start), restart, or redeploy. Data may survive a
# same-container pause, but is not guaranteed. Do not promise to keep
# enterprise data on a free instance. This Blueprint does not provision
# a persistent disk or managed database.
# For HTTPS production set:
#   LTZS_COOKIE_SECURE=1
#   LTZS_PUBLIC_ORIGIN=https://your-public-host
# Do not trust client-supplied X-Forwarded-Proto for CSRF origin checks.
services:
  - type: web
    name: longtan-zhice
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LTZS_COOKIE_SECURE
        value: "1"
      # Set LTZS_PUBLIC_ORIGIN to the public https origin of this service.
